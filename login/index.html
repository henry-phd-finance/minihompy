<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>미니홈피 로그인</title>
  <link rel="stylesheet" href="../assets/login.css">
  <script src="../supabase-config.js" defer></script>
  <script src="../visitor-identity-config.js" defer></script>
  <script src="../assets/vendor/supabase-2.116.0.js" defer></script>
  <script src="../supabase-client.js" defer></script>
  <script src="../assets/login-flow.js" defer></script>
  <script src="../visitor-identity-login.js" defer></script>
</head>
<body>
  <main class="login-card">
    <p class="brand">MINIHOMPY</p>
    <h1>미니홈피 로그인</h1>
    <p class="description">내 아이디로 미니홈피를 방문하세요.</p>
    <ol class="steps" aria-label="로그인 순서"><li>1. 아이디 확인</li><li aria-current="step">2. 비밀번호 입력</li></ol>
    <form id="password-form">
      <div class="field"><label for="handle">아이디</label><input id="handle" name="username" autocomplete="username" readonly></div>
      <div class="field"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024" disabled></div>
      <p id="message" class="message" role="status" aria-live="polite">로그인 요청을 확인하고 있습니다.</p>
      <button id="submit" type="submit" disabled>로그인</button>
    </form>
    <a id="restart" class="button" hidden>다시 로그인</a>
    <button id="cancel" class="secondary" type="button">취소</button>
  </main>
</body>
</html>

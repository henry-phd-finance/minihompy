# Password authentication happens in this personal Supabase project.
[functions.owner-login]
verify_jwt = false

# Opaque member sessions are validated by the handler, not Supabase JWT auth.
[functions.member-writing]
verify_jwt = false

# Public approximate visitor counters; raw database writes remain service-only.
[functions.visit-counts]
verify_jwt = false

# Public image bytes and verified personal-owner uploads; never signed URLs.
[functions.photo-media]
verify_jwt = false
